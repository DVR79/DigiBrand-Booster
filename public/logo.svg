<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 80" width="580" height="80" role="img">
  <title>Digi Brand Booster — Performance Marketing Agency Bangalore</title>
  <desc>Wordmark logo with icon for Digi Brand Booster</desc>

  <!-- Icon: Rocket boost arrow in a circle -->
  <circle cx="36" cy="38" r="34" fill="#1a73e8"/>

  <!-- Rising bars inside circle -->
  <rect x="16" y="52" width="8" height="14" rx="2" fill="#ffffff" opacity="0.4"/>
  <rect x="28" y="42" width="8" height="24" rx="2" fill="#ffffff" opacity="0.65"/>
  <rect x="40" y="30" width="8" height="36" rx="2" fill="#ffffff" opacity="0.85"/>
  <rect x="52" y="20" width="8" height="46" rx="2" fill="#60a5fa"/>

  <!-- Trend arrow -->
  <polyline points="16,46 32,30 44,38 60,16" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="60,16 52,26 68,24" fill="#ffffff"/>

  <!-- Wordmark -->
  <text x="84" y="42" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="36" fill="#1a73e8" letter-spacing="1">DIGI </text>
  <text x="196" y="42" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="36" fill="#60a5fa" letter-spacing="1">BRAND </text>
  <text x="352" y="42" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="36" fill="#1a73e8" letter-spacing="1">BOOSTER</text>

  <!-- Divider line with dots -->
  <circle cx="84" cy="54" r="3.5" fill="#60a5fa"/>
  <line x1="91" y1="54" x2="574" y2="54" stroke="#1a73e8" stroke-width="1" opacity="0.2"/>
  <circle cx="576" cy="54" r="3.5" fill="#1a73e8"/>

  <!-- Tagline -->
  <text x="330" y="70" font-family="'Segoe UI', Arial, sans-serif" font-weight="400" font-size="9" fill="#aaaaaa" letter-spacing="3" text-anchor="middle">PERFORMANCE MARKETING AGENCY · BANGALORE</text>
</svg>
