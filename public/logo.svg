<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 70" width="500" height="70" role="img">
  <title>DigiBrand Booster — Performance Marketing Agency Bangalore</title>
  <desc>Logo for DigiBrand Booster</desc>

  <!-- Icon circle -->
  <circle cx="32" cy="32" r="30" fill="#1a73e8"/>
  <rect x="14" y="44" width="7" height="14" rx="2" fill="#ffffff" opacity="0.35"/>
  <rect x="25" y="36" width="7" height="22" rx="2" fill="#ffffff" opacity="0.6"/>
  <rect x="36" y="26" width="7" height="32" rx="2" fill="#ffffff" opacity="0.85"/>
  <rect x="47" y="18" width="7" height="40" rx="2" fill="#60a5fa"/>
  <polyline points="14,40 28,26 40,33 54,14" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="54,14 47,23 61,22" fill="#ffffff"/>

  <!-- Wordmark in Nunito -->
  <text x="76" y="40" font-family="'Nunito', sans-serif" font-weight="900" font-size="36" letter-spacing="-0.5">
    <tspan fill="#1a73e8">Digi</tspan><tspan fill="#60a5fa">Brand</tspan><tspan fill="#1a73e8"> Booster</tspan>
  </text>

  <!-- Underline accent -->
  <rect x="76" y="49" width="65" height="3" rx="1.5" fill="#60a5fa"/>

  <!-- Tagline -->
  <text x="76" y="65" font-family="'Nunito', sans-serif" font-weight="400" font-size="9" fill="#aaaaaa" letter-spacing="2.5">PERFORMANCE MARKETING AGENCY · BANGALORE</text>
</svg>
